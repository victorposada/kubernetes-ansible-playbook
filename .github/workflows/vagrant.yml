name: vagrant-up

on: [push]

jobs:
  vagrant-up:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Cache Vagrant boxes
        run: sudo apt update && sudo apt upgrade -y && sudo apt install vagrant && sudo apt instal virtualbox -y

      - name: Show Vagrant version
        run: vagrant --version

      - name: Run vagrant up
        run: cd vagrant/basic && vagrant up

      - name: ssh into box after boot
        run: vagrant ssh -c "echo 'hello world!'"

